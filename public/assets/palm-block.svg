<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="blockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="24" fill="url(#blockBg)"/>
  
  <!-- Grid of palm trees topographic layout -->
  <g fill="#10B981" opacity="0.8">
    <!-- Row 1 -->
    <circle cx="60" cy="50" r="14"/><circle cx="130" cy="50" r="14"/><circle cx="200" cy="50" r="14"/><circle cx="270" cy="50" r="14"/><circle cx="340" cy="50" r="14"/>
    <!-- Row 2 -->
    <circle cx="95" cy="110" r="16"/><circle cx="165" cy="110" r="16"/><circle cx="235" cy="110" r="16"/><circle cx="305" cy="110" r="16"/>
    <!-- Row 3 -->
    <circle cx="60" cy="170" r="15"/><circle cx="130" cy="170" r="15"/><circle cx="200" cy="170" r="15"/><circle cx="270" cy="170" r="15"/><circle cx="340" cy="170" r="15"/>
    <!-- Row 4 -->
    <circle cx="95" cy="230" r="17"/><circle cx="165" cy="230" r="17"/><circle cx="235" cy="230" r="17"/><circle cx="305" cy="230" r="17"/>
  </g>

  <!-- Connective Path Grid lines (Harvesting Path / Pasar Pikul) -->
  <path d="M40,50 L360,50 M40,110 L360,110 M40,170 L360,170 M40,230 L360,230" stroke="#059669" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M95,30 L95,260 M235,30 L235,260" stroke="#F59E0B" stroke-width="3" opacity="0.7"/>

  <!-- High Yield Tag -->
  <rect x="20" y="240" width="120" height="40" rx="12" fill="#10B981"/>
  <text x="35" y="265" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">HIGH YIELD</text>
</svg>
