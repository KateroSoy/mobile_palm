<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="#0F172A"/>

  <!-- Fertilizer Bag Shadow -->
  <ellipse cx="200" cy="350" rx="130" ry="25" fill="#000000" opacity="0.4"/>

  <!-- Fertilizer Bag Body -->
  <path d="M100,100 C120,70 280,70 300,100 L320,310 C320,330 300,340 200,340 C100,340 80,330 80,310 Z" fill="url(#bagGrad)"/>
  
  <!-- Stitch Top Ribbon -->
  <rect x="90" y="85" width="220" height="20" rx="6" fill="#F8FAFC"/>
  <path d="M95,95 L305,95" stroke="#0284C7" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- Center Label Badge -->
  <rect x="110" y="140" width="180" height="150" rx="16" fill="#FFFFFF"/>
  <rect x="120" y="150" width="160" height="40" rx="10" fill="url(#labelGrad)"/>
  <text x="145" y="177" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="22">NPK 15-15-15</text>

  <!-- Sprout Icon inside label -->
  <circle cx="200" cy="235" r="30" fill="#E0F2FE"/>
  <path d="M200,250 C200,230 185,215 175,215 C175,230 190,245 200,250 Z" fill="#0284C7"/>
  <path d="M200,250 C200,230 215,215 225,215 C225,230 210,245 200,250 Z" fill="#0369A1"/>
  
  <text x="155" y="278" fill="#64748B" font-family="sans-serif" font-weight="bold" font-size="14">BERAT: 50 KG</text>
</svg>
