<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="metalTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="#18181B"/>

  <!-- Fuel Drum Shadow -->
  <ellipse cx="200" cy="350" rx="110" ry="25" fill="#000000" opacity="0.5"/>

  <!-- Main Drum Body -->
  <rect x="100" y="100" width="200" height="230" rx="20" fill="url(#drumGrad)"/>
  
  <!-- Drum Rib Lines -->
  <rect x="96" y="150" width="208" height="12" rx="6" fill="#B91C1C"/>
  <rect x="96" y="230" width="208" height="12" rx="6" fill="#B91C1C"/>
  
  <!-- Top Lid -->
  <ellipse cx="200" cy="100" rx="100" ry="25" fill="url(#metalTop)"/>
  <ellipse cx="200" cy="100" rx="90" ry="20" fill="#374151"/>

  <!-- Cap / Bung -->
  <circle cx="160" cy="98" r="10" fill="#E5E7EB"/>
  <circle cx="240" cy="98" r="6" fill="#E5E7EB"/>

  <!-- Fuel Flame Warning Badge -->
  <polygon points="200,180 230,235 170,235" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M200,200 C205,210 215,215 210,225 C205,230 195,230 190,225 C185,215 195,210 200,200 Z" fill="#DC2626"/>

  <text x="145" y="275" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="20">SOLAR B35</text>
  <text x="155" y="295" fill="#FECACA" font-family="sans-serif" font-weight="bold" font-size="12">DIESEL FUEL 200L</text>
</svg>
