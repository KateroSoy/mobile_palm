<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="#022C22"/>

  <!-- Canister Body -->
  <rect x="110" y="120" width="180" height="210" rx="28" fill="url(#chemGrad)"/>
  
  <!-- Handle -->
  <path d="M140,120 L140,80 L260,80 L260,120" stroke="#065F46" stroke-width="18" stroke-linecap="round" fill="none"/>
  
  <!-- Cap -->
  <rect x="220" y="65" width="45" height="25" rx="6" fill="#F59E0B"/>
  
  <!-- Measure Gauge Window -->
  <rect x="130" y="150" width="20" height="150" rx="10" fill="#FFFFFF" opacity="0.3"/>
  <rect x="130" y="210" width="20" height="90" rx="10" fill="#FDE047"/>

  <!-- Label -->
  <rect x="165" y="160" width="110" height="130" rx="14" fill="#FFFFFF"/>
  <circle cx="220" cy="205" r="24" fill="#ECFDF5"/>
  <!-- Leaf/Shield Icon -->
  <path d="M220,190 C235,190 235,215 220,225 C205,215 205,190 220,190 Z" fill="#10B981"/>
  
  <text x="175" y="255" fill="#065F46" font-family="sans-serif" font-weight="900" font-size="14">HERBISIDA</text>
  <text x="190" y="275" fill="#6EE7B7" font-family="sans-serif" font-weight="bold" font-size="11">20 LITER</text>
</svg>
